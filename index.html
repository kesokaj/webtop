<!DOCTYPE html>
<html lang="en">
<head>
    <title>Webtop</title>
    <meta charset="utf-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #screen {
            width: 100%;
            height: 100%;
        }
        #sendCtrlAltDelButton {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font: 11px sans-serif;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #sendCtrlAltDelButton:hover {
            opacity: 1;
            background: rgba(0,0,0,0.8);
        }
        /* Show button on hover near top-right corner */
        body:hover #sendCtrlAltDelButton {
            opacity: 0.3;
        }
    </style>
    <script type="module" crossorigin="anonymous">
        import RFB from './core/rfb.js';

        const host = window.location.hostname;
        const port = window.location.port;
        const path = 'websockify';

        let url;
        if (window.location.protocol === "https:") {
            url = 'wss';
        } else {
            url = 'ws';
        }
        url += '://' + host;
        if (port) {
            url += ':' + port;
        }
        url += '/' + path;

        const rfb = new RFB(document.getElementById('screen'), url);

        rfb.addEventListener("connect", () => {
            document.title = "Webtop";
        });
        rfb.addEventListener("disconnect", (e) => {
            if (!e.detail.clean) {
                document.title = "Webtop (disconnected)";
            }
        });

        // Fill the browser window and dynamically resize
        rfb.scaleViewport = true;
        rfb.resizeSession = true;
        rfb.clipViewport = false;

        document.getElementById('sendCtrlAltDelButton')
            .onclick = () => { rfb.sendCtrlAltDel(); return false; };
    </script>
</head>
<body>
    <button id="sendCtrlAltDelButton">Send CtrlAltDel</button>
    <div id="screen"></div>
</body>
</html>
